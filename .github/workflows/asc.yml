name: App Store Connect (read TestFlight status)
on:
  push:
    branches: [qa/testflight-59-status]
    paths: [.github/workflows/asc.yml]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install App Store Connect client dependencies
        run: python3 -m pip install -q pyjwt cryptography
      - name: Read TestFlight processing and team availability
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: "59"
          NEW_VERSION: "0.5.1"
        run: |
          umask 077
          export KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$P8" > "$KEY"
          python3 .github/scripts/asc_status.py
