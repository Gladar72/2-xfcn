name: Submit iOS 0.5.2 (60) for manual release
on:
  push:
    branches: [release/ios-052-60-manual-review]
    paths:
      - .github/workflows/asc.yml
      - .github/scripts/asc.py
permissions:
  contents: read
concurrency:
  group: ios-052-60-review
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Обновить версию
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: "60"
          NOTES_FILE: .github/review-notes.txt
          WHATS_NEW_FILE: .github/whats-new.txt
          SUBMIT: "true"
        run: |
          umask 077
          export KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$P8" > "$KEY"
          pip install -q pyjwt cryptography
          export NEW_VERSION="$(python3 -c "import json;print(json.load(open('mobile/app.json'))['expo']['version'])")"
          python3 .github/scripts/asc.py
          rm -f "$KEY"
