name: Android map check

# Проверка карты на эмуляторе: собирает тестовое APK (сразу открывает карту, без входа,
# с тремя примерами меток), запускает на Android-эмуляторе, снимает экран.
# Снимки и журнал ошибок — в ветке smoke-shots. В магазин эта сборка не идёт.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_MAP_SMOKE: "1"
      EXPO_PUBLIC_STORE: rustore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Проверка типов (TypeScript)
        working-directory: mobile
        run: |
          mkdir -p ../shots
          npx tsc --noEmit > ../shots/tsc.txt 2>&1 && echo "OK" >> ../shots/tsc.txt || true
          cat ../shots/tsc.txt | tail -n 40

      - name: Патч RuStore SDK под новый React Native
        working-directory: mobile
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("node_modules/react-native-rustore-push/android/src/main/java/com/rustorepush/RustorePushModule.kt")
          s = p.read_text()
          s2 = re.sub(r"fun onNewIntent\(\s*(\w+)\s*:\s*Intent\?\s*\)", r"fun onNewIntent(\1: Intent)", s)
          s2 = re.sub(r"fun onActivityResult\(\s*(\w+)\s*:\s*Activity\?", r"fun onActivityResult(\1: Activity", s2)
          p.write_text(s2)
          PY

      - name: Android-проект (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Сборка тестового APK (x86_64 для эмулятора)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Запуск на эмуляторе и снимки экрана
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p $GITHUB_WORKSPACE/shots
            adb install -r $GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell pm grant ru.mesto.app android.permission.ACCESS_FINE_LOCATION || true
            adb logcat -c
            adb shell monkey -p ru.mesto.app -c android.intent.category.LAUNCHER 1
            sleep 45
            adb exec-out screencap -p > $GITHUB_WORKSPACE/shots/map-1.png
            sleep 20
            adb exec-out screencap -p > $GITHUB_WORKSPACE/shots/map-2.png
            adb shell pidof ru.mesto.app > $GITHUB_WORKSPACE/shots/alive.txt || echo "НЕ ЗАПУЩЕНО (упало?)" > $GITHUB_WORKSPACE/shots/alive.txt
            adb logcat -d | grep -E "ReactNativeJS|AndroidRuntime|FATAL|MapLibre|mbgl|maplibre" | tail -n 300 > $GITHUB_WORKSPACE/shots/log.txt || true

      - name: Снимки в ветку smoke-shots
        if: always()
        run: |
          mkdir -p /tmp/s shots && cp -r shots/. /tmp/s/ && cd /tmp/s
          git init -q && git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm "Снимки проверки карты" && \
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:smoke-shots
