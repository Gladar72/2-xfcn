name: Проверка возврата билета в Test
on:
  workflow_dispatch:
  push:
    branches: [feature/approved-event-ticket-payments]
    paths: [.github/workflows/ticket-refund-test.yml]
permissions:
  contents: read
jobs:
  refund:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Вернуть 1500 тестовых рублей по оплаченному заказу
        env:
          TICKET_TEST_SHOP_ID: "1466532"
          TICKET_TEST_SECRET_KEY: ${{ secrets.TICKET_TEST_SECRET_KEY }}
        run: node_modules/.bin/tsx tests/ops/ticket-refund.ts
