name: iOS

# Сборка iPhone-версии «Места» в GitHub на macOS (без Mac и без облака Expo).
# Запуск: Actions → iOS → Run workflow.
#   check   — проверочная сборка для симулятора, без подписи и без аккаунта Apple:
#             показывает, что приложение собирается под iOS.
#   release — подписанная сборка и загрузка в App Store Connect (TestFlight).
#
# Для release (один раз, после регистрации в Apple Developer Program):
#   переменная репозитория APPLE_TEAM_ID       — Team ID (developer.apple.com → Membership)
#   секрет ASC_KEY_ID, ASC_ISSUER_ID          — ключ App Store Connect API (Users and Access → Integrations, роль Admin)
#   секрет ASC_KEY_P8                         — содержимое файла AuthKey_XXXX.p8
# Сертификат и профиль создаются по этому ключу на время сборки (.github/scripts/ios-sign.py) и потом отзываются.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check — проверка сборки, release — в App Store Connect, shots — снимки экранов на симуляторе iPhone"
        type: choice
        options: [check, release, shots]
        default: check

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Секреты на месте?
        if: inputs.mode == 'release'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KID ISS P8; do
            if [ -z "${!v}" ]; then echo "::error::Не задано: $v (см. шапку ios.yml)"; exit 1; fi
          done

      - name: Xcode 26 (App Store принимает только сборки на iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::На раннере нет Xcode 26"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: iOS-проект из app.json (expo prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Имя проекта
        id: proj
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "workspace: $WS, scheme: $SCHEME"
          xcodebuild -version

      - name: Проверочная сборка (симулятор, без подписи)
        if: inputs.mode == 'check'
        run: |
          set -o pipefail
          xcodebuild -workspace "${{ steps.proj.outputs.ws }}" -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: Снимки экранов на iPhone (тестовые данные, без входа)
        if: inputs.mode == 'shots'
        env:
          EXPO_PUBLIC_UI_SMOKE: "1"
        run: |
          set -o pipefail
          xcodebuild -workspace "${{ steps.proj.outputs.ws }}" -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 15
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          DT=$(xcrun simctl list devicetypes | grep -oE "iPhone 1[0-9] Pro Max" | sort -V | tail -1)
          RT=$(xcrun simctl list runtimes | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+" | sort -V | tail -1)
          echo "device: $DT runtime: $RT"
          UDID=$(xcrun simctl create shots "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p "$GITHUB_WORKSPACE/ishots"
          xcrun simctl launch "$UDID" ru.mesto.app
          for i in $(seq -w 0 32); do xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/ishots/t$i.png" >/dev/null 2>&1; sleep 6; done
          cd "$GITHUB_WORKSPACE/ishots" && git init -q && git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm "Снимки iPhone" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ios-shots

      - name: Номер сборки
        if: inputs.mode == 'release'
        run: |
          PLIST=$(ls ios/*/Info.plist | grep -v Tests | head -1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      - name: Сертификат и профиль App Store (через API, временные)
        if: inputs.mode == 'release'
        id: sign
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$P8" > "$KEY"
          pip3 install --break-system-packages -q pyjwt cryptography || pip3 install -q pyjwt cryptography
          python3 ../.github/scripts/ios-sign.py

      - name: Архив и загрузка в App Store Connect
        if: inputs.mode == 'release'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$KID.p8"
          cp "$RUNNER_TEMP/AuthKey.p8" "$KEY"
          xcodebuild -workspace "${{ steps.proj.outputs.ws }}" -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mesto.xcarchive" archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -nE "error:|rror:|[Pp]rovision|[Ss]igning|certificate" "$RUNNER_TEMP/archive.log" | grep -v "note:" | tail -n 60; exit 1; }
          tail -n 5 "$RUNNER_TEMP/archive.log"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>ru.mesto.app</key><string>${{ steps.sign.outputs.uuid }}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Mesto.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" 2>&1 | grep -v "note:" | tail -n 60
          echo "Сборка ${{ github.run_number }} загружена в App Store Connect — появится в TestFlight через 10–30 минут."

      - name: Отозвать временный сертификат (если сборка упала)
        if: failure() && inputs.mode == 'release'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export KEY="$RUNNER_TEMP/AuthKey.p8"
          [ -f "$KEY" ] && python3 ../.github/scripts/ios-sign.py revoke || true

      - name: Убрать ключи
        if: always() && inputs.mode == 'release'
        run: rm -f "$RUNNER_TEMP"/AuthKey*.p8 "$RUNNER_TEMP"/dist.*
