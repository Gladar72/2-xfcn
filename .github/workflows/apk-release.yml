name: APK в релиз

# Кладёт APK из сборки «Android APK» в GitHub Release — одна прямая ссылка на .apk
# (удобно скачать и загрузить в RuStore без распаковки zip).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID запуска «Android APK»"
        required: true
      tag:
        description: "Тег релиза"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R apk
          F=$(find apk -name '*.apk' | head -1)
          gh release create "${{ inputs.tag }}" "$F" --repo "${{ github.repository }}" --title "Android ${{ inputs.tag }}" --notes "APK для RuStore" --prerelease
