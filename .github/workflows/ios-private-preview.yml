name: Update the private iPhone announcement
on:
  push:
    branches: [promo/private-052-preview-20261122]
    paths: [.github/workflows/ios-private-preview.yml]

permissions:
  contents: read
  statuses: write

jobs:
  preview:
    if: github.event.before == '4be388fb706708791ce448041c6088cf755e4239' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/promo/ios-launch-20261120.jpg
            /public/promo/ios-launch-20261120.txt
      - name: Send the approved announcement to Andrey
        id: personal
        env:
          BOT_TOKEN: ${{ secrets.YC_BOT_TOKEN }}
          RECIPIENT: ${{ vars.YC_ADMIN_IDS }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFile, appendFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';

          const id = (process.env.RECIPIENT || '').trim();
          if (!/^[1-9]\d*$/.test(id)) throw new Error('Expected exactly one private chat ID');
          if (!process.env.BOT_TOKEN) throw new Error('Bot credential unavailable');
          const url = 'https://apps.apple.com/ru/app/id6833348222';
          const label = 'Скачать в App Store';
          const base = 'public/promo/ios-launch-20261120';
          const copy = (await readFile(base + '.txt', 'utf8')).trim();
          const footer = '\n\n📱 ' + label + '\n' + url;
          assert.ok(copy.endsWith(footer), 'Approved button or URL changed');
          const caption = copy.slice(0, -footer.length).replace('📱 Скачай приложение на iPhone.', 'Ставь ❤️ тем, кто рядом, зови на встречу и знакомься! Нас уже 1 500.\n\n📱 Скачай приложение на iPhone.');
          assert.ok(caption.length > 0 && caption.length <= 1024);

          async function api(method, body) {
            let response;
            try {
              response = await fetch('https://api.telegram.org/bot' + process.env.BOT_TOKEN + '/' + method, {
                method: 'POST', body, redirect: 'error', signal: AbortSignal.timeout(40000)
              });
            } catch {
              throw new Error(method + ': network error');
            }
            const data = await response.json();
            if (!response.ok || !data.ok) {
              const error = new Error(method + ': Telegram error ' + response.status);
              error.status = response.status;
              error.description = data.description || '';
              throw error;
            }
            return data.result;
          }

          const me = await api('getMe', new URLSearchParams());
          if (me.username?.toLowerCase() !== 'mesto_people_bot') throw new Error('Wrong sender');
          const chat = await api('getChat', new URLSearchParams({ chat_id: id }));
          const nameHash = createHash('sha256').update((chat.username || '').toLowerCase()).digest('hex');
          if (chat.type !== 'private' || String(chat.id) !== id || nameHash !== '7f0ca19279d8c80910e72763aa0c84f81a8ac63cb70dc13507f2c1734a7e105a') {
            throw new Error('Private recipient did not match');
          }
          console.log('Verified sender and one private recipient.');
          const markup = { inline_keyboard: [[{ text: label, url }]] };
          assert.equal(caption, "🎉 «Место» теперь официально в App Store!\n\nСтавь ❤️ тем, кто рядом, зови на встречу и знакомься! Нас уже 1 500.\n\n📱 Скачай приложение на iPhone. Оно стало намного удобнее и быстрее. И самое главное — скачать его можно бесплатно!\n\n🎁 При первом входе получишь 30 дней тарифа «Старт» абсолютно бесплатно.\n\n💳 Через 30 дней, если захочешь продлить подписку, нажми «Оплатить подписку» в меню нашего Telegram-бота.\n\n🙏 Не забудь поставить 5 звёзд — это поможет нам быть первыми в поиске.\n⭐⭐⭐⭐⭐");
          const form = new FormData();
          form.set('chat_id', id);
          form.set('caption', caption);
          form.set('reply_markup', JSON.stringify(markup));
          form.set('photo', new Blob([await readFile(base + '.jpg')], { type: 'image/jpeg' }), 'mesto.jpg');
          const result = await api('sendPhoto', form);
          assert.ok(String(result.chat.id) === id && result.message_id > 0 && result.photo?.length);
          assert.ok(result.caption === caption && result.reply_markup.inline_keyboard.length === 1);
          const row = result.reply_markup.inline_keyboard[0];
          assert.ok(row.length === 1 && row[0].text === label && row[0].url === url);
          console.log('Confirmed one new private photo message: ' + result.message_id);
          await appendFile(process.env.GITHUB_OUTPUT, 'message_id=' + result.message_id + '\n');
          JS

      - name: Record the private send result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SEND_OUTCOME: ${{ steps.personal.outcome }}
          MESSAGE_ID: ${{ steps.personal.outputs.message_id }}
        run: |
          state=failure
          description='Private send not confirmed'
          if [ "$SEND_OUTCOME" = success ] && [ -n "$MESSAGE_ID" ]; then
            state=success
            description="Confirmed Telegram message $MESSAGE_ID"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='mesto/private-preview' -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
