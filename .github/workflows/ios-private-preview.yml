name: Update the private iPhone announcement
on:
  push:
    branches: [promo/private-052-preview-20261122]
    paths: [.github/workflows/ios-private-preview.yml]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.before == '3a2d4e06939f500d32f69d5eb4f6645a5ec338ce' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Update the verified private preview
        env:
          BOT_TOKEN: ${{ secrets.YC_BOT_TOKEN }}
          RECIPIENT: ${{ vars.YC_ADMIN_IDS }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';

          const id = (process.env.RECIPIENT || '').trim();
          if (!/^[1-9]\d*$/.test(id)) throw new Error('Expected exactly one private chat ID');
          if (!process.env.BOT_TOKEN) throw new Error('Bot credential unavailable');
          const url = 'https://apps.apple.com/ru/app/id6833348222';
          const label = 'Скачать в App Store';
          const message = '❤️ Ставь сердечки тем, кто рядом, зови на встречу и знакомься! Нас уже 1 500.\n\nПервые 30 дней тарифа «Старт» — бесплатно. Пользуйся!';

          async function api(method, body) {
            let response;
            try {
              response = await fetch('https://api.telegram.org/bot' + process.env.BOT_TOKEN + '/' + method, {
                method: 'POST', body, redirect: 'error', signal: AbortSignal.timeout(40000)
              });
            } catch {
              throw new Error(method + ': network error');
            }
            const data = await response.json();
            if (!response.ok || !data.ok) {
              const error = new Error(method + ': Telegram error ' + response.status);
              error.status = response.status;
              error.description = data.description || '';
              throw error;
            }
            return data.result;
          }

          const me = await api('getMe', new URLSearchParams());
          if (me.username?.toLowerCase() !== 'mesto_people_bot') throw new Error('Wrong sender');
          const chat = await api('getChat', new URLSearchParams({ chat_id: id }));
          const nameHash = createHash('sha256').update((chat.username || '').toLowerCase()).digest('hex');
          if (chat.type !== 'private' || String(chat.id) !== id || nameHash !== '7f0ca19279d8c80910e72763aa0c84f81a8ac63cb70dc13507f2c1734a7e105a') {
            throw new Error('Private recipient did not match');
          }
          console.log('Verified sender and one private recipient.');
          const markup = { inline_keyboard: [[{ text: label, url }]] };
          const form = new URLSearchParams({chat_id: id, text: message, reply_markup: JSON.stringify(markup)});
          const result = await api('sendMessage', form);
          assert.ok(String(result.chat.id) === id && result.message_id > 0);
          assert.ok(result.text === message && result.reply_markup.inline_keyboard.length === 1);
          const row = result.reply_markup.inline_keyboard[0];
          assert.ok(row.length === 1 && row[0].text === label && row[0].url === url);
          console.log('Confirmed private preview and its App Store button. Message ' + result.message_id);
          JS
