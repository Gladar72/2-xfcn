name: Compare iPhone 60 and Telegram screens
on:
  push:
    branches: [qa/iphone60-telegram-visual]
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c2264b08e5296af1e55016dbfbb5e4e438bde4d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the released client for the simulator with fixture data
        working-directory: mobile
        env:
          EXPO_PUBLIC_UI_SMOKE: "1"
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          npm install --no-audit --no-fund
          # The screenshot driver controls navigation instead of the existing timed screen tour.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/_layout.tsx")
          s = p.read_text()
          old = 'seq.forEach((h, i) => setTimeout(() => router.replace(h), i * 16000));'
          assert old in s
          driver = "const routes: Href[] = [\"/(tabs)\",\"/(tabs)/map\",\"/(tabs)/meet\",\"/(tabs)/profile\",\"/people\",\"/(tabs)/chats\",\"/notifications\",\"/hearts\",\"/search\",\"/event/e1\",\"/create\",\"/settings\",\"/subscription\",\"/business\",\"/ticket/e1\",\"/tickets/e1\",\"/applications/e1\",\"/profile-edit\",\"/(auth)/login\",\"/(auth)/register\",\"/legal/offer\",\"/privacy\",\"/reviews\",\"/partner\",\"/support\",\"/interests\",\"/link-email\"] as Href[]; let last = -1; const show = () => { const n = Math.floor(Date.now() / 8000) % routes.length; if (n !== last) { last = n; router.replace(routes[n]!); } }; show(); setInterval(show, 250);"
          p.write_text(s.replace(old, driver))
          PY
          npx expo prebuild --platform ios --clean
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" || { tail -80 "$RUNNER_TEMP/build.log"; exit 1; }
      - name: Capture sections of the iPhone client
        run: |
          set -euo pipefail
          DT=$(xcrun simctl list devicetypes | grep -oE 'iPhone 1[0-9] Pro Max' | sort -V | tail -1)
          RT=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | sort -V | tail -1)
          UDID=$(xcrun simctl create MestoScreens "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$(ls -d "$RUNNER_TEMP"/sim/Build/Products/Release-iphonesimulator/*.app | head -1)"
          xcrun simctl launch "$UDID" ru.mesto.app
          sleep 28
          mkdir -p shots
          python3 - <<'PY'
          import pathlib, time, subprocess, os
          names=["feed","map","meet","me","people","chats","notif","hearts","search","event","create","settings","plans","biz","ticket","tickets","requests","edit","login","onboarding","offer","privacy","reviews","partner","support","interests","contact"]
          seen=set()
          udid=subprocess.check_output(["xcrun","simctl","list","devices","booted"],text=True)
          import re
          device=re.search(r"\(([0-9A-Fa-f-]{36})\) \(Booted\)",udid).group(1)
          while len(seen)<len(names):
              tick=time.time()
              name=names[int(tick//8)%len(names)]
              if name not in seen and 4 <= tick%8 < 6:
                  raw=os.path.join(os.environ["RUNNER_TEMP"],"screen.png")
                  subprocess.run(["xcrun","simctl","io",device,"screenshot",raw],check=True)
                  subprocess.run(["sips","-Z","740","-s","format","jpeg","-s","formatOptions","78",raw,"--out",f"shots/{name}.jpg"],check=True,stdout=subprocess.DEVNULL)
                  seen.add(name)
              time.sleep(.3)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iphone60
          path: shots/
          retention-days: 3
