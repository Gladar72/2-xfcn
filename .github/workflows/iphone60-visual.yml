name: Compare iPhone 60 and Telegram screens
on:
  push:
    branches: [qa/iphone60-telegram-visual]
permissions:
  contents: read
jobs:
  telegram:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6eb9112618607349bcca413df6d22ad5ebe938ef
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test likes, account linking and gallery on both engines
        run: npx playwright test telegram-parity.spec.ts --timeout=35000 --reporter=line
      - name: Capture screens at iPhone viewport size
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tests/browser/redesign-shots.spec.ts")
          s=p.read_text().replace('["feed", "/feed"],', '["hearts","/hearts"],["partner","/partner"],["privacy","/settings/privacy"],["reviews","/reviews"],["support","/support"],["interests","/profile/interests"],["contact","/settings/contact/email"],["feed", "/feed"],')
          p.write_text(s)
          PY
          SHOTS_DIR="$PWD/shots" npx playwright test redesign-shots.spec.ts --project=webkit-mobile --timeout=60000 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-webkit
          path: shots/
          retention-days: 3
