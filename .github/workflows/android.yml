name: Android APK

# Сборка Android-приложения «Место» для RuStore прямо в GitHub (облако Expo/EAS из России недоступно).
# Запуск: Actions → Android APK → Run workflow. Готовый APK — в разделе Artifacts внизу страницы запуска.
#
# Секреты репозитория (один раз):
#   ANDROID_KEYSTORE_BASE64   — ключ подписи приложения (файл .keystore в base64)
#   ANDROID_KEYSTORE_PASSWORD — пароль к нему (alias ключа — mesto)
# Переменная репозитория (по желанию): RUSTORE_PUSH_PROJECT_ID — ID проекта пушей RuStore.
# Ключ подписи терять нельзя: обновления в RuStore принимаются только с тем же ключом.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_STORE: rustore
      EXPO_PUBLIC_RUSTORE_PUSH_PROJECT_ID: ${{ vars.RUSTORE_PUSH_PROJECT_ID }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ключ подписи на месте?
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Нет секретов ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"; exit 1
          fi

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Android-проект из app.json (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Репозиторий RuStore подключён?
        run: grep -n "vkpartner" android/build.gradle

      - name: Подпись релиза
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()
          s = s.replace("signingConfigs {", """signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'mesto'
                      keyPassword System.getenv('KS_PASS')
                  }""", 1)
          i = s.index("buildTypes")
          j = s.index("release {", i)
          k = s.index("signingConfig signingConfigs.debug", j)
          s = s[:k] + "signingConfig signingConfigs.release" + s[k + len("signingConfig signingConfigs.debug"):]
          open(p, "w").write(s)
          PY

      - name: Сборка APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesto-rustore-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
