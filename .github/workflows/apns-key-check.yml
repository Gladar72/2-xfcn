name: Validate private Apple Push settings
on:
  push:
    branches: [fix/apns-key-format]
    paths: [.github/workflows/apns-key-check.yml]
permissions:
  contents: read
  statuses: write
jobs:
  check:
    if: github.event.before == '5e93c96755c3c0b15b61813458ee7a77afc15f7d' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate format without revealing any secret values
        id: check
        env:
          APNS_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: node deploy/yandex/normalize-apns-key.mjs --check
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=mesto/apns-format -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
