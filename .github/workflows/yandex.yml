# Сервер «Места» в Yandex Cloud: запуск задач по SSH (см. deploy/yandex/README.md).
# Запускается вручную: Actions → «Yandex Cloud» → Run workflow → выбрать задачу.
# Автодеплой при каждом коммите в main включается переменной репозитория YC_AUTODEPLOY=on.
name: Yandex Cloud

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача"
        required: true
        default: status
        type: choice
        options: [status, bootstrap, supabase, migrate, deploy, logs, webhook, tgcheck, envcheck, keytest, health, storagefix, eventsdiag, bizdiag, storyshot, promodiag, promofix, giftdiag, statsdiag, broadcast, restoreevents, reauthnotify, blockedcount, blocksreport, cleanup]
  push:
    branches: [main]

concurrency:
  group: yandex-server
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.YC_AUTODEPLOY == 'on'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    env:
      TASK: ${{ github.event.inputs.task || 'deploy' }}
      HOST: ${{ secrets.YC_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.YC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload settings
        if: env.TASK != 'bootstrap'
        # Ключи Supabase, CRON_SECRET и секрет вебхука сервер создаёт сам (deploy/yandex/make-env.py).
        # Отсюда передаются только токен бота, ID админов и необязательные доп. строки из YC_APP_ENV.
        env:
          BOT_TOKEN: ${{ secrets.YC_BOT_TOKEN }}
          ADMIN_IDS: ${{ vars.YC_ADMIN_IDS }}
          APP_ENV: ${{ secrets.YC_APP_ENV }}
          # Переезд: переменные репозитория (не секреты). Пустые — не меняют настройки сервера.
          APP_HOSTS: ${{ vars.YC_APP_HOSTS }}
          CRON_ENABLED: ${{ vars.YC_CRON_ENABLED }}
        run: |
          { printf 'TELEGRAM_BOT_TOKEN=%s\nADMIN_TELEGRAM_IDS=%s\n' "$BOT_TOKEN" "$ADMIN_IDS"; printf '%s\n' "$APP_ENV";
            printf 'APP_HOSTS=%s\nCRON_ENABLED=%s\n' "$APP_HOSTS" "$CRON_ENABLED"; } |
            ssh deploy@"$HOST" 'sudo mkdir -p /opt/mesto && sudo chown deploy /opt/mesto && umask 077 && cat > /opt/mesto/inputs.env'

      - name: Upload migration settings
        if: env.TASK == 'migrate' || env.TASK == 'reauthnotify'
        env:
          OLD_DB_URL: ${{ secrets.YC_OLD_DB_URL }}
        run: |
          printf 'OLD_DB_URL=%s\n' "$OLD_DB_URL" | ssh deploy@"$HOST" 'umask 077 && cat > /opt/mesto/migrate.env'

      - name: Run ${{ env.TASK }}
        run: |
          set -o pipefail
          ssh deploy@"$HOST" 'bash -s' -- "$TASK" < deploy/yandex/remote.sh 2>&1 | tee run.log

      - name: Publish failure log to branch
        if: failure() || endsWith(env.TASK, 'diag') || env.TASK == 'promofix' || env.TASK == 'broadcast'
        run: |
          mkdir -p failog && tail -c 200000 run.log > failog/run.log || true
          cd failog && git init -q && git checkout -q -b deploylog
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm deploylog
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploylog

      - name: Fetch story renders
        if: env.TASK == 'storyshot'
        run: mkdir -p storyshot && scp -q 'deploy@'"$HOST"':/tmp/storyshot/*.png' storyshot/ || true

      - name: Publish story renders to branch
        if: env.TASK == 'storyshot'
        run: |
          cd storyshot && git init -q && git checkout -q -b storyshot
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm storyshot
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" storyshot

      - name: Clean up migration settings
        if: always() && (env.TASK == 'migrate' || env.TASK == 'reauthnotify')
        run: ssh deploy@"$HOST" 'rm -f /opt/mesto/migrate.env' || true
