name: Repeat tap selection and sharing for the mobile release
on:
  push:
    branches: [qa/telegram60-mobile-regression]
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, webkit-mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05959e83c732aba4797a52f64f68a64be7b4755f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --project=${{ matrix.project }} --grep "sends the selected business event|Instagram success|different main photo|empty-chat wheel" --repeat-each=3 --timeout=35000 --reporter=line
