name: Full mobile Mini App regression
on:
  push:
    branches: [qa/telegram60-mobile-regression]
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, webkit-mobile]
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e747b5721b7fdd6ac6654e6744da4956a8facb2c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --timeout=60000 --reporter=line
