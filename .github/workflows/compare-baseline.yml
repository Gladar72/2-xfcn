name: Confirm Mini App public deployment
on:
  push:
    branches: [qa/telegram60-mobile-regression]
permissions: {}
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Confirm the released artwork and the public web entry
        run: |
          set -eu
          curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 -fsSL -o /tmp/mesto-eyes.webp https://mesto-go.ru/brand/creature/ios60/eyes.webp
          echo "0817f562089dc43a55aac3cb03bf35b700f74633346a2b3f44b05fcb96034e9a  /tmp/mesto-eyes.webp" | sha256sum -c -
          curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 -fsSL -o /tmp/mesto-entry.html -w 'Public hearts entry HTTP %{http_code}\n' https://mesto-go.ru/hearts
          test -s /tmp/mesto-entry.html
